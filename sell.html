<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K.ARTS｜作品を買う</title>

<style>
:root{
  --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#dc2626; --shadow:0 10px 28px rgba(0,0,0,.14); --radius:18px;
}
*{ box-sizing:border-box; }
body{
  margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text);
  background:
    radial-gradient(circle at 10% 10%, #fde68a 0%, transparent 40%),
    radial-gradient(circle at 90% 20%, #fca5a5 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, #86efac 0%, transparent 40%),
    linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
}

/* header */
.topbar{
  position:sticky; top:0; z-index:30;
  background:rgba(255,255,255,.92); backdrop-filter: blur(10px);
  border-bottom:1px solid var(--line); padding:10px 12px;
}
.title{ font-weight:900; text-align:center; font-size:16px; }
.subnav{ display:flex; justify-content:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
.linkbtn{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:10px 14px; font-weight:900; text-decoration:none; color:var(--text);
}
.linkbtn.primary{ background:#111827; color:#fff; border:none; }

.wrap{ padding:16px; max-width:980px; margin:0 auto; }
.panel{
  background:
    linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.9)),
    linear-gradient(135deg, #fde68a, #fca5a5, #86efac);
  border-radius:24px; padding:16px;
}
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 2px 10px; }
.section-title{ font-size:14px; font-weight:900; }
.hint{ font-size:12px; color:var(--muted); }

.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
@media (min-width:900px){ .grid{ grid-template-columns:repeat(3,1fr); } }

.card{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; cursor:pointer; position:relative;
}
.img{
  height:170px; background:linear-gradient(180deg,#e5e7eb,#d1d5db);
  display:flex; align-items:center; justify-content:center; color:#374151; font-weight:900;
  overflow:hidden;
}
.img img{ width:100%; height:100%; object-fit:cover; display:block; }
.content{ padding:14px; }
.name{ font-weight:900; font-size:15px; }
.desc{ margin-top:6px; font-size:13px; color:var(--muted); line-height:1.35; }
.price{ margin-top:10px; font-size:20px; font-weight:900; }

.add-pill{
  position:absolute; top:10px; right:10px;
  background:rgba(17,24,39,.9); color:#fff;
  font-weight:900; font-size:12px; padding:6px 10px; border-radius:999px;
}

/* FABs */
.fabs{
  position:fixed; right:16px; bottom:16px; z-index:60;
  display:flex; flex-direction:column; gap:10px;
}
.fab{
  background:#111827; color:#fff; border:none; border-radius:999px;
  padding:14px 16px; box-shadow:0 14px 30px rgba(0,0,0,.25);
  cursor:pointer; display:flex; align-items:center; gap:10px; font-weight:900;
}
.badge{
  min-width:22px; height:22px; border-radius:999px; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; padding:0 6px;
}
.fab.secondary{ background:#0f172a; }
.fab.danger{ background:#7f1d1d; }

/* modal */
.modal{
  position:fixed; inset:0; background:rgba(0,0,0,.35);
  display:none; align-items:flex-end; justify-content:center; z-index:80;
}
.modal.open{ display:flex; }
.sheet{
  width:min(980px, 100%);
  background:#fff; border-radius:20px 20px 0 0; box-shadow:0 -20px 40px rgba(0,0,0,.25);
  padding:14px;
}
.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.sheet-title{ font-weight:900; }
.sheet-close{
  border:1px solid var(--line); background:#fff; border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:900;
}
.cartlist{ margin-top:12px; display:flex; flex-direction:column; gap:10px; max-height:45vh; overflow:auto; padding-bottom:6px; }
.row{
  border:1px solid var(--line); border-radius:14px; padding:10px;
  display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center;
}
.rname{ font-weight:900; }
.rmeta{ color:var(--muted); font-size:12px; margin-top:2px; }
.rctrl{ display:flex; gap:8px; align-items:center; }
.btn{
  border:1px solid var(--line); background:#fff; border-radius:12px; padding:10px 12px; cursor:pointer; font-weight:900;
}
.btn.primary{ background:#111827; color:#fff; border:none; }
.total{
  margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  display:flex; justify-content:space-between; align-items:center; font-weight:900;
}
.small{ font-size:12px; color:var(--muted); font-weight:700; }
</style>
</head>

<body>
<div class="topbar">
  <div class="title">K.ARTS｜作品を買う</div>
  <div class="subnav">
    <a class="linkbtn primary" href="./buy.html">買う</a>
    <a class="linkbtn" href="./custom.html">自分で選ぶ</a>
    <a class="linkbtn" href="./sell.html">売る</a>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="section-head">
      <div>
        <div class="section-title">作品一覧</div>
        <div class="hint">気になる作品をタップ → カートに追加</div>
      </div>
      <div class="hint" id="countHint"></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="fabs">
  <button class="fab" id="cartFab">🛒 カート <span class="badge" id="cartBadge">0</span></button>
  <button class="fab secondary" id="checkoutFab">🧾 レジに進む</button>
  <button class="fab danger" id="clearFab">🗑 すべて削除</button>
</div>

<!-- Cart Modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">カート</div>
      <button class="sheet-close" id="closeBtn">閉じる</button>
    </div>

    <div class="cartlist" id="cartList"></div>

    <div class="total">
      <div>
        合計 <span class="small" id="taxNote">（税込/目安）</span>
      </div>
      <div id="totalYen">¥0</div>
    </div>

    <div style="margin-top:12px; display:flex; gap:10px;">
      <button class="btn" id="keepShopping">続けて選ぶ</button>
      <button class="btn primary" id="checkoutBtn">レジに進む</button>
    </div>
  </div>
</div>

<script>
/**
 * 作品データ（ここに「君の作品一覧」を増やしていく）
 * image は「Cloudinary URL」でも「GitHub Pagesの画像URL」でもOK
 */
const PRODUCTS = [
  {
    id: "A00001",
    name: "黄葉の世界",
    price: 2800,
    desc: "黄色の植物中心。やわらかい秋の雰囲気。",
    image: "" // ← CloudinaryのURLを入れる（https://res.cloudinary.com/...）
  },
  {
    id: "A00002",
    name: "苔と石の森",
    price: 3200,
    desc: "苔×石で落ち着く世界観。人気。",
    image: ""
  },
  {
    id: "A00003",
    name: "紅葉（赤）",
    price: 2800,
    desc: "赤系の植物で強めの世界観。",
    image: ""
  }
];

// ===== cart storage =====
function loadCart(){
  try{ return JSON.parse(localStorage.getItem("karts_buy_cart")||"{}"); }
  catch(e){ return {}; }
}
function saveCart(c){ localStorage.setItem("karts_buy_cart", JSON.stringify(c)); }
let cart = loadCart();

function money(n){
  return "¥" + (n||0).toLocaleString("ja-JP");
}
function cartCount(){
  return Object.values(cart).reduce((s,it)=>s+(it.qty||0),0);
}
function cartTotal(){
  let t = 0;
  for(const [id, it] of Object.entries(cart)){
    const p = PRODUCTS.find(x=>x.id===id);
    if(p) t += (p.price||0) * (it.qty||0);
  }
  return t;
}
function addToCart(id){
  if(!cart[id]) cart[id] = { id, qty:0 };
  cart[id].qty += 1;
  saveCart(cart);
  renderBadge();
}
function changeQty(id, delta){
  if(!cart[id]) return;
  cart[id].qty += delta;
  if(cart[id].qty <= 0) delete cart[id];
  saveCart(cart);
  renderAll();
}
function clearCart(){
  cart = {};
  saveCart(cart);
  renderAll();
}

// ===== render =====
function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  PRODUCTS.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";
    card.setAttribute("data-id", p.id);
    card.innerHTML = `
      <div class="add-pill">＋ 追加</div>
      <div class="img" id="img_${p.id}">写真</div>
      <div class="content">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="desc">${escapeHtml(p.desc || "")}</div>
        <div class="price">${money(p.price)}</div>
      </div>
    `;
    card.addEventListener("click", ()=>addToCart(p.id));
    grid.appendChild(card);

    // image
    const imgBox = card.querySelector(`#img_${cssId(p.id)}`);
    if(p.image && p.image.trim().startsWith("http")){
      imgBox.innerHTML = `<img src="${p.image.trim()}" alt="${escapeHtml(p.name)}">`;
    }else{
      imgBox.textContent = "写真 まだ";
    }
  });

  document.getElementById("countHint").textContent = `全${PRODUCTS.length}点`;
}

function renderBadge(){
  document.getElementById("cartBadge").textContent = String(cartCount());
}

function renderCartList(){
  const list = document.getElementById("cartList");
  list.innerHTML = "";

  const entries = Object.entries(cart);
  if(entries.length === 0){
    list.innerHTML = `<div class="hint">カートは空です</div>`;
    document.getElementById("totalYen").textContent = "¥0";
    return;
  }

  entries.forEach(([id, it])=>{
    const p = PRODUCTS.find(x=>x.id===id);
    if(!p) return;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div>
        <div class="rname">${escapeHtml(p.name)}</div>
        <div class="rmeta">${money(p.price)} × ${it.qty}　/　小計 ${money(p.price * it.qty)}</div>
      </div>
      <div class="rctrl">
        <button class="btn" data-act="minus">−</button>
        <button class="btn" data-act="plus">＋</button>
      </div>
    `;
    row.querySelector('[data-act="minus"]').addEventListener("click",(e)=>{ e.stopPropagation(); changeQty(id,-1); });
    row.querySelector('[data-act="plus"]').addEventListener("click",(e)=>{ e.stopPropagation(); changeQty(id, +1); });
    list.appendChild(row);
  });

  document.getElementById("totalYen").textContent = money(cartTotal());
}

function renderAll(){
  renderBadge();
  renderCartList();
}

function openModal(){ document.getElementById("modal").classList.add("open"); renderCartList(); }
function closeModal(){ document.getElementById("modal").classList.remove("open"); }

// helpers
function escapeHtml(s){
  return String(s??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}
function cssId(s){ return String(s).replaceAll(/[^a-zA-Z0-9_-]/g, "_"); }

// events
document.getElementById("cartFab").addEventListener("click", openModal);
document.getElementById("closeBtn").addEventListener("click", closeModal);
document.getElementById("keepShopping").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", (e)=>{ if(e.target.id==="modal") closeModal(); });

document.getElementById("clearFab").addEventListener("click", ()=>{
  if(confirm("カートをすべて削除しますか？")) clearCart();
});

function checkout(){
  const total = cartTotal();
  if(total <= 0){ alert("カートが空です"); return; }
  alert(`合計金額：${money(total)}\n（このあと本実装で「注文番号」表示やレジ画面に進めます）`);
}
document.getElementById("checkoutFab").addEventListener("click", checkout);
document.getElementById("checkoutBtn").addEventListener("click", ()=>{ closeModal(); checkout(); });

// init
renderGrid();
renderAll();
</script>
</body>
</html>
