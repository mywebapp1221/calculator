<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.ARTS｜自分で選ぶ</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#f3f4f6;
  padding-bottom:80px;
}
header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px;
  text-align:center;
  font-weight:900;
}
nav{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:8px;
}
nav a{
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #ddd;
  text-decoration:none;
  color:#111;
  font-weight:700;
}
nav a.active{
  background:#111;
  color:#fff;
}
main{
  max-width:900px;
  margin:20px auto;
  padding:12px;
}
.section{
  margin-bottom:24px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 6px 16px rgba(0,0,0,.1);
  overflow:hidden;
  position:relative;
}
.img{
  height:120px;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
}
.add{
  position:absolute;
  top:10px;
  right:10px;
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:6px 10px;
  font-weight:900;
}
.content{
  padding:12px;
}
.price{
  font-weight:900;
}

/* 注文バー */
.orderbar{
  position:fixed;
  left:0; right:0; bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.orderbtn{
  background:#111;
  color:#fff;
  border:none;
  border-radius:12px;
  padding:10px 16px;
  font-weight:900;
}
</style>
</head>

<body>
<header>
  K.ARTS メニュー（自分で選ぶ）
  <nav>
    <a href="index.html">セット</a>
    <a class="active" href="custom.html">自分で選ぶ</a>
    <a href="buy.html">買う</a>
  </nav>
</header>

<main>
  <div class="section">
    <h3>第一層｜地面</h3>
    <div class="grid">
      <div class="card" onclick="add(50)">
        <div class="add">＋</div>
        <div class="img">土</div>
        <div class="content">土 ¥50</div>
      </div>
      <div class="card" onclick="add(100)">
        <div class="add">＋</div>
        <div class="img">石</div>
        <div class="content">石 ¥100</div>
      </div>
    </div>
  </div>

  <div class="section">
    <h3>第三層｜仕上げ</h3>
    <div class="grid">
      <div class="card" onclick="add(500)">
        <div class="add">＋</div>
        <div class="img">花</div>
        <div class="content">花 ¥500</div>
      </div>
    </div>
  </div>
</main>

<div class="orderbar">
  <div>
    合計：<span id="total">¥0</span>
  </div>
  <button class="orderbtn">レジに進む</button>
</div>

<script>
let total = 0;
function add(price){
  total += price;
  document.getElementById("total").textContent = "¥" + total;
}
</script>
</body>
</html>
