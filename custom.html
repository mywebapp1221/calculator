<script>
/* ===== Cloudinary（後で入れられる） ===== */
const PHOTO = {
  soil:"", stone:"", moss:"", green:"",
  momiji_red:"", momiji_yellow:"", nobara:"", watage:"",
  flower:""
};

/* ===== 自分で選ぶ 商品マスタ ===== */
const ITEMS = {
  l1_soil:  { id:"l1_soil",  name:"土",     price:50,  layer:"第一層", type:"custom", image:PHOTO.soil },
  l1_stone: { id:"l1_stone", name:"石",     price:100, layer:"第一層", type:"custom", image:PHOTO.stone },
  l1_moss:  { id:"l1_moss",  name:"苔",     price:200, layer:"第一層", type:"custom", image:PHOTO.moss },
  l1_green: { id:"l1_green", name:"緑植物", price:300, layer:"第一層", type:"custom", image:PHOTO.green },

  l2_momiji_red:    { id:"l2_momiji_red",    name:"紅葉【赤色】", price:200, layer:"第二層", type:"custom", image:PHOTO.momiji_red },
  l2_momiji_yellow: { id:"l2_momiji_yellow", name:"紅葉【黄色】", price:200, layer:"第二層", type:"custom", image:PHOTO.momiji_yellow },
  l2_nobara:        { id:"l2_nobara",        name:"ノバラ",       price:200, layer:"第二層", type:"custom", image:PHOTO.nobara },
  l2_watage:        { id:"l2_watage",        name:"綿毛",         price:200, layer:"第二層", type:"custom", image:PHOTO.watage },

  l3_flower: { id:"l3_flower", name:"花", price:500, layer:"第三層", type:"custom", image:PHOTO.flower },
};

function yen(n){ return "¥"+n.toLocaleString("ja-JP"); }

/* ===== カート（セット＋カスタム共通） ===== */
function loadCart(){ try{ return JSON.parse(localStorage.getItem("karts_cart")||"{}"); }catch(e){ return {}; } }
function saveCart(c){ localStorage.setItem("karts_cart", JSON.stringify(c)); }
let cart = loadCart();

function addCustom(id){
  const it = ITEMS[id];
  if(!it) return;
  if(!cart[id]) cart[id]={ id, qty:0, ...it };
  cart[id].qty += 1;
  saveCart(cart);
  renderCart();
}

function cartCount(){ return Object.values(cart).reduce((s,it)=>s+it.qty,0); }
function cartTotal(){
  return Object.values(cart).reduce((s,it)=>s + it.price*it.qty, 0);
}

/* ===== レンダリング ===== */
function makeCard(it){
  const d=document.createElement("div"); d.className="card";
  d.innerHTML = `
    <div class="add-pill">＋ 追加</div>
    <div class="img">${it.image?`<img src="${it.image}" alt="${it.name}">`:"写真 まだ"}</div>
    <div class="content">
      <div class="name">${it.name}</div>
      <div class="desc">${it.layer}</div>
      <div class="price">${yen(it.price)}</div>
    </div>`;
  d.onclick=()=>addCustom(it.id);
  return d;
}
function renderLayers(){
  layer1.innerHTML=""; layer2.innerHTML=""; layer3.innerHTML="";
  ["l1_soil","l1_stone","l1_moss","l1_green"].forEach(id=>layer1.appendChild(makeCard(ITEMS[id])));
  ["l2_momiji_red","l2_momiji_yellow","l2_nobara","l2_watage"].forEach(id=>layer2.appendChild(makeCard(ITEMS[id])));
  ["l3_flower"].forEach(id=>layer3.appendChild(makeCard(ITEMS[id])));
}

function renderCart(){
  cartBadge.textContent = String(cartCount());
  cartTotalEl.textContent = yen(cartTotal());

  if(!Object.keys(cart).length){
    cartList.innerHTML = `<div class="cart-empty">カートは空です</div>`;
    return;
  }
  cartList.innerHTML="";
  Object.values(cart).forEach(it=>{
    const row=document.createElement("div"); row.className="cart-item";
    row.innerHTML = `
      <div class="cart-thumb">${it.image?`<img src="${it.image}">`:""}</div>
      <div class="cart-meta">
        <div class="cart-name">${it.name}</div>
        <div class="cart-sub">${it.type==="set"?"セット":"自分で選ぶ"} / ${yen(it.price)}</div>
        <div class="cart-row">
          <div class="qty">
            <button data-d>-</button><span>${it.qty}</span><button data-i>+</button>
          </div>
          <button class="icon-btn" data-x>削除</button>
        </div>
      </div>`;
    row.querySelector("[data-d]").onclick=()=>{ it.qty--; if(it.qty<=0) delete cart[it.id]; saveCart(cart); renderCart(); };
    row.querySelector("[data-i]").onclick=()=>{ it.qty++; saveCart(cart); renderCart(); };
    row.querySelector("[data-x]").onclick=()=>{ delete cart[it.id]; saveCart(cart); renderCart(); };
    cartList.appendChild(row);
  });
}

checkoutBtn.onclick=()=>{
  let html="";
  Object.values(cart).forEach(it=>{
    html+=`<div class="row"><span>${it.name} × ${it.qty}</span><span>${yen(it.price*it.qty)}</span></div>`;
  });
  html+=`<div class="row sum"><span>合計</span><span>${yen(cartTotal())}</span></div>`;
  receipt.innerHTML=html;
  modal.classList.add("show");
};

clearCart.onclick=()=>{ cart={}; saveCart(cart); renderCart(); };

renderLayers();
renderCart();
</script>
