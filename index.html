<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>K.ARTS メニュー</title>

<style>
:root{
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#dc2626;
  --shadow:0 2px 10px rgba(0,0,0,.08);
  --radius:14px;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%, #fde68a 0%, transparent 40%),
    radial-gradient(circle at 90% 20%, #fca5a5 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, #86efac 0%, transparent 40%),
    linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
}

/* ===== ヘッダー ===== */
.topbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.9);
  backdrop-filter: blur(6px);
  border-bottom:1px solid var(--line);
  padding:10px 12px;
}
.title{
  font-weight:900;
  text-align:center;
  font-size:16px;
}

/* ===== タブ ===== */
.tabs{
  display:flex;
  justify-content:center;
  gap:28px;
  margin-top:8px;
}
.tab{
  padding:10px 6px;
  font-size:14px;
  color:var(--muted);
  border-bottom:3px solid transparent;
  font-weight:700;
}
.tab.active{
  color:var(--text);
  border-bottom-color:var(--text);
}

/* ===== レイアウト ===== */
.wrap{
  padding:14px;
  max-width:980px;
  margin:0 auto;
}

#panel-set{
  background:
    linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.88)),
    linear-gradient(135deg, #fde68a, #fca5a5, #86efac);
  border-radius:20px;
  padding:14px;
}

/* ===== セクション ===== */
.section-head{
  display:flex;
  align-items:center;
  gap:8px;
  margin:10px 2px 6px;
}
.section-tag{
  background:linear-gradient(135deg, #dc2626, #f97316);
  color:#fff;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  font-weight:900;
}
.section-title{
  font-size:13px;
  font-weight:900;
}
.section-sub{
  margin:0 2px 10px;
  font-size:12px;
  color:var(--muted);
}

/* ===== グリッド ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.grid.two-only{
  grid-template-columns:repeat(2,1fr);
}

/* ===== カード ===== */
.card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* ===== 画像表示（ここ超重要） ===== */
.img{
  height:180px;
  position:relative;
  overflow:hidden;
  background:#ddd;
}
.img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.img-label{
  position:absolute;
  left:10px;
  bottom:10px;
  background:rgba(0,0,0,.6);
  color:#fff;
  padding:4px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

/* ===== テキスト ===== */
.content{ padding:12px; }
.name{
  font-weight:900;
  font-size:15px;
}
.desc{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
}
.price{
  margin-top:10px;
  font-size:22px;
  font-weight:900;
}

/* ===== VS ===== */
.vs{
  margin:10px 2px 14px;
  padding:10px 12px;
  border-radius:12px;
  background:#fff;
  border:1px solid var(--line);
  font-weight:900;
  display:flex;
  justify-content:space-between;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="title">K.ARTS メニュー</div>
  <div class="tabs">
    <div class="tab active">セット</div>
    <div class="tab">自分で選ぶ</div>
  </div>
</div>

<div class="wrap">
<div id="panel-set">

  <!-- 期間限定 -->
  <div class="section-head">
    <span class="section-tag">期間限定</span>
    <span class="section-title">紅葉 vs 黄葉</span>
  </div>
  <p class="section-sub">今だけ｜色で選ぶ自然アート</p>

  <div class="grid two-only">

    <!-- 紅葉 -->
    <div class="card">
      <div class="img">
        <span class="img-label">紅葉</span>
        <img src="image/IMG_20251207_132950699_HDR.jpg" alt="紅葉セット">
      </div>
      <div class="content">
        <div class="name">紅葉セット</div>
        <div class="desc">🔴 赤色の植物 使い放題</div>
        <div class="price">¥2,800〜</div>
      </div>
    </div>

    <!-- 黄葉 -->
    <div class="card">
      <div class="img">
        <span class="img-label">黄葉</span>
        <img src="image/IMG_20251207_132950699_HDR.jpg" alt="黄葉セット">
      </div>
      <div class="content">
        <div class="name">黄葉セット</div>
        <div class="desc">🟡 黄色の植物 使い放題</div>
        <div class="price">¥2,800〜</div>
      </div>
    </div>

  </div>

  <div class="vs">
    <span>紅か、黄か。</span>
    <span>どっち派？</span>
  </div>

</div>
</div>

</body>
</html>
