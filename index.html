<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>K.ARTS 植物えらび</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding: 16px;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .hint {
      font-size: 0.9rem;
      color: #4b5563;
      margin-bottom: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr)); /* 縦5マス */
      gap: 6px;
      margin-bottom: 16px;
    }

    .cell {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 70px; /* スマホでもなんとか押せるサイズ */
    }

    .cell img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 2px;
    }

    .name {
      font-size: 0.65rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .price {
      font-size: 0.6rem;
      color: #6b7280;
    }

    .cell.selected {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.25);
      background: #eff6ff;
    }

    .summary {
      position: sticky;
      bottom: 0;
      background: #f3f4f6;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    #totalAmount {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .btn-confirm {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 999px;
      background: #16a34a;
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-confirm:active {
      opacity: 0.85;
    }

    .selected-list {
      font-size: 0.75rem;
      color: #4b5563;
      margin-bottom: 8px;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <h1>植物をえらんでください</h1>
  <p class="hint">
    マスをタップするとえらべます。もう一度タップすると解除できます。<br>
    下に合計金額が表示されます。
  </p>

  <div class="grid" id="plantGrid">
    <!-- ここに40マス分つくる。今は例として8個だけ入れてる -->
    <div class="cell" data-name="苔" data-price="200">
      <!-- 実際は img src="..." に差し替え -->
      <img src="https://via.placeholder.com/150?text=%E8%8B%94" alt="苔">
      <div class="name">苔</div>
      <div class="price">+200円</div>
    </div>

    <div class="cell" data-name="石" data-price="200">
      <img src="https://via.placeholder.com/150?text=%E7%9F%B3" alt="石">
      <div class="name">石</div>
      <div class="price">+200円</div>
    </div>

    <div class="cell" data-name="葉" data-price="200">
      <img src="https://via.placeholder.com/150?text=%E8%91%89" alt="葉">
      <div class="name">葉</div>
      <div class="price">+200円</div>
    </div>

    <div class="cell" data-name="小枝" data-price="200">
      <img src="https://via.placeholder.com/150?text=%E5%B0%8F%E6%9E%9D" alt="小枝">
      <div class="name">小枝</div>
      <div class="price">+200円</div>
    </div>

    <div class="cell" data-name="赤い実" data-price="400">
      <img src="https://via.placeholder.com/150?text=%E8%B5%A4%E3%81%84%E5%AE%9F" alt="赤い実">
      <div class="name">赤い実</div>
      <div class="price">+400円</div>
    </div>

    <div class="cell" data-name="ブルーベリー" data-price="400">
      <img src="https://via.placeholder.com/150?text=Blue" alt="ブルーベリー">
      <div class="name">ブルーベリー</div>
      <div class="price">+400円</div>
    </div>

    <div class="cell" data-name="白い花" data-price="500">
      <img src="https://via.placeholder.com/150?text=%E8%8A%B1" alt="白い花">
      <div class="name">白い花</div>
      <div class="price">+500円</div>
    </div>

    <div class="cell" data-name="黄色い花" data-price="500">
      <img src="https://via.placeholder.com/150?text=%E8%89%B2" alt="黄色い花">
      <div class="name">黄色い花</div>
      <div class="price">+500円</div>
    </div>

    <!-- 本番ではここに残りのマスもコピペして増やす（40個まで） -->
  </div>

  <div class="summary">
    <div class="selected-list" id="selectedList"></div>
    <div class="total-line">
      <span>合計金額：</span>
      <span id="totalAmount">0円</span>
    </div>
    <button class="btn-confirm" id="btnConfirm">この内容でお支払いへ</button>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const totalAmountEl = document.getElementById('totalAmount');
    const selectedListEl = document.getElementById('selectedList');
    const btnConfirm = document.getElementById('btnConfirm');

    function updateSummary() {
      let total = 0;
      const selectedNames = [];

      cells.forEach(cell => {
        if (cell.classList.contains('selected')) {
          const price = Number(cell.dataset.price || "0");
          const name = cell.dataset.name || "";
          total += price;
          selectedNames.push(name);
        }
      });

      totalAmountEl.textContent = total.toLocaleString() + "円";
      selectedListEl.textContent =
        selectedNames.length > 0
          ? "えらんだ植物：" + selectedNames.join("、")
          : "";
      return total;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        cell.classList.toggle('selected');  // ON/OFF 変更
        updateSummary();
      });
    });

    btnConfirm.addEventListener('click', () => {
      const total = updateSummary();
      if (total === 0) {
        alert("まだ植物がえらばれていません。");
        return;
      }
      alert("合計 " + total.toLocaleString() + "円 です。\nこのあと実際の決済画面に進めるように実装できます。");
    });
  </script>
</body>
</html>
