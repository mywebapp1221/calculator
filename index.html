<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.ARTS セット選択</title>

<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f4f4f4;
  }

  h1 {
    font-size: 1.3rem;
    text-align: center;
    margin-bottom: 20px;
  }

  .set-box {
    background: white;
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .set-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: #2563eb;
  }

  .popular {
    color: #ef4444;
    font-weight: bold;
    font-size: 0.9rem;
  }

  .price {
    font-size: 1.1rem;
    margin-top: 8px;
    margin-bottom: 12px;
  }

  .old-price {
    text-decoration: line-through;
    color: #6b7280;
  }

  .set-detail {
    font-size: 0.95rem;
    margin-bottom: 10px;
    line-height: 1.4rem;
  }

  .btn {
    width: 100%;
    background: #2563eb;
    color: white;
    padding: 14px;
    text-align: center;
    border-radius: 12px;
    font-size: 1rem;
    margin-top: 10px;
    cursor: pointer;
    border: none;
  }
  .btn:active {
    opacity: 0.8;
  }

  .small-link {
    text-align: center;
    font-size: 0.85rem;
    margin-top: 20px;
    color: #555;
  }

  .small-link a {
    color: #4b5563;
    text-decoration: underline;
  }
</style>
</head>

<body>

<h1>500円から始められます。<br>迷わない３つのセットがおすすめです。</h1>

<!-- Aセット -->
<div class="set-box">
  <div class="set-title">Aセット（おすすめ）</div>
  <div class="popular">いちばん選ばれています</div>

  <div class="price">
    <span class="old-price">3,300円</span> → <strong>3,200円（100円引き）</strong>
  </div>

  <div class="set-detail">
    ● 植物 4種類<br>
    ● 花 1個<br>
    ● ネット公開つき（家族にも見せられます）
  </div>

  <button class="btn" onclick="chooseSet('A')">Aセットを選ぶ</button>
</div>

<!-- Bセット -->
<div class="set-box">
  <div class="set-title">Bセット</div>
  <div class="price">
    <span class="old-price">1,500円</span> → <strong>1,400円（100円引き）</strong>
  </div>

  <div class="set-detail">
    ● 植物 3種類<br>
    ● ＋500円で花を追加できます
  </div>

  <button class="btn" onclick="chooseSet('B')">Bセットを選ぶ</button>
</div>

<!-- Cセット -->
<div class="set-box">
  <div class="set-title">Cセット</div>
  <div class="price">
    <span class="old-price">900円</span> → <strong>800円（100円引き）</strong>
  </div>

  <div class="set-detail">
    ● 植物 1種類<br>
    ● ＋500円で花を追加できます
  </div>

  <button class="btn" onclick="chooseSet('C')">Cセットを選ぶ</button>
</div>

<!-- 個別選択リンク（目立たせない） -->
<div class="small-link">
  ── または ──<br>
  <a href="plants.html">1つずつ選ぶ（セット割引なし）</a>
</div>

<script>
function chooseSet(plan) {
  // 選んだセットを保存（次のページで読み取る）
  localStorage.setItem("KARTS_PLAN", plan);
  window.location.href = "confirm.html";
}
</script>

</body>
</html>
